[project]
name = "ev-logistics-service"
version = "0.1.0"
description = "전기 물류 트럭 배차·구간별 에너지 예측·충전 계획·ETA 서비스 (부산항 신선대 → HJIT)"
readme = "README.md"
authors = [
    { name = "OK SEO YUN" },
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.62.0",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ev_logistics"
module-root = "src"
